name: FieldMate validation
on:
  push:
    branches:
      - main
      - feature/fieldmate-subscriptions-and-branding
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: fieldmate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm run build:cloudflare
